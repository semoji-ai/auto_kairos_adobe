<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>auto_kairos PD</title>
  <style>
    body { font-family: -apple-system, sans-serif; background:#23262b; color:#e6e6e6;
           margin:0; padding:0; font-size:13px; }
    h1 { font-size:15px; margin:0 0 12px; }
    button { width:100%; padding:10px; margin:6px 0; border:0; border-radius:6px;
             background:#3a6df0; color:#fff; font-size:13px; cursor:pointer; }
    button.alt { background:#444; }
    button.tab { background:#2c2f36; color:#c5c8cc; border-radius:0; margin:0; }
    button.tab.active { background:#3a6df0; color:#fff; }
    .box { background:#1b1d21; border:1px solid #33363c; border-radius:6px;
           padding:10px; margin:8px 0; white-space:pre-wrap; word-break:break-all;
           min-height:18px; font-family: ui-monospace, monospace; font-size:12px; }
    .label { color:#9aa0a6; margin-top:10px; }
    [hidden] { display:none !important; }

    /* 셸 레이아웃 */
    #view-list { padding:16px; }
    #view-detail { display:flex; flex-direction:column; height:100vh; }
    #detail-header { display:flex; align-items:center; gap:8px; padding:10px 14px;
                     background:#1b1d21; border-bottom:1px solid #33363c; }
    #detailTitle { flex:1; font-size:14px; font-weight:600; }
    #btnBackToList { width:auto; padding:6px 12px; margin:0; background:#444; }
    #task-bar { padding:8px 14px; font-size:11px; color:#9aa0a6;
                border-bottom:1px solid #2c2f36; }
    #tabs { display:flex; border-bottom:1px solid #33363c; }
    #tabs .tab { flex:1; }
    #tab-content { flex:1; min-height:0; overflow:hidden; }
    #tab-planning { height:100%; overflow-y:auto; padding:14px; box-sizing:border-box; }
    #tab-storyboard { height:100%; box-sizing:border-box; }
    #chat-dock { border-top:1px solid #33363c; background:#1b1d21; padding:10px 14px; }
    #chat-dock .row { display:flex; gap:6px; }
    #chatInput { flex:1; box-sizing:border-box; padding:8px; background:#23262b;
                 color:#e6e6e6; border:1px solid #33363c; border-radius:5px; }
    #btnChatSend { width:auto; padding:8px 14px; margin:0; }
    .chat-msg { margin:2px 0; font-size:12px; line-height:1.4; }

    /* 스토리보드 프로덕션 시트 — 가로 행 테이블(씬#|이미지|스크립트|에셋|TTS) */
    #sheet { overflow-x:auto; }
    .sheet-head, .sheet-row { display:grid;
      grid-template-columns: var(--cols, 30px 200px 280px 120px 70px);
      gap:8px; align-items:start; width:max-content; min-width:100%; }
    .sheet-head { color:#9aa0a6; font-size:11px; padding:6px 0;
      border-bottom:1px solid #33363c; position:sticky; top:0; background:#23262b; z-index:1; }
    .sheet-row { padding:8px 0; border-bottom:1px solid #2c2f36; }
    .sheet-row .col-num { color:#9aa0a6; font-size:12px; padding-top:2px; }
    .sheet-row .col-img { position:relative; }
    .sheet-row .col-img img.main { width:100%; border-radius:4px; display:block; }
    .sheet-row .col-img .lyr { width:32px; height:auto; margin:3px 3px 0 0; border-radius:3px; }
    .sheet-row .unlink-img { display:none; position:absolute; top:2px; right:2px;
      width:auto; margin:0; padding:2px 6px; font-size:11px; background:rgba(0,0,0,0.6); }
    .sheet-row .col-img:hover .unlink-img { display:block; }
    .sheet-row .layer-img { display:none; position:absolute; top:2px; right:28px;
      width:auto; margin:0; padding:2px 6px; font-size:11px; background:rgba(0,0,0,0.6); }
    .sheet-row .col-img:hover .layer-img { display:block; }
    .sheet-row .row-title { font-size:11px; color:#c5c8cc; margin-bottom:3px; }
    .sheet-row textarea.nar { width:100%; box-sizing:border-box; background:#23262b;
      color:#e6e6e6; border:1px solid #33363c; border-radius:5px; padding:6px; font-size:12px;
      overflow:hidden; resize:none; min-height:42px; }
    .sheet-row .row-status { font-size:11px; color:#9aa0a6; }
    .sheet-row button { margin:4px 0; padding:6px; font-size:12px; }
    .col-tts audio { width:100%; height:28px; margin-top:4px; }
    .col-tts .gen-tts { width:auto; }
    .scene-badges { display:flex; gap:2px; margin-top:4px; }
    .scene-badges .badge { font-size:9px; padding:1px 3px; border-radius:3px; }
    .scene-badges .badge.on { background:#2d7d46; color:#fff; }
    .scene-badges .badge.off { background:#333; color:#777; }
    .scene-ops { display:flex; flex-wrap:wrap; gap:2px; margin-top:4px; }
    .scene-ops button { font-size:11px; padding:1px 4px; width:auto; margin:0;
      background:rgba(255,255,255,0.08); border:none; color:#bbb; cursor:pointer; border-radius:3px; }
    .scene-ops button:hover { background:rgba(255,255,255,0.2); color:#fff; }
    .sheet-head > div { position:relative; }
    .col-resize { position:absolute; right:-4px; top:0; width:8px; height:100%;
      cursor:col-resize; }
    .col-resize:hover { background:#3a6df0; opacity:0.4; }

    /* 스토리보드 2-pane — 각 패널 독립 세로 스크롤 */
    #sb-2pane { display:flex; gap:12px; align-items:stretch; height:100%;
      padding:14px; box-sizing:border-box; }
    #sb-left { flex:1; min-width:0; overflow-y:auto; }
    #sb-right { width:320px; flex:0 0 320px; overflow-y:auto; }
    #sb-toolbar { display:flex; flex-wrap:wrap; gap:4px; }
    #sb-toolbar button { width:auto; flex:0 0 auto; margin:0; padding:6px 8px; font-size:12px; }
    .sb-search { display:flex; gap:4px; margin:6px 0; }
    .sb-search input { flex:1; min-width:0; box-sizing:border-box; padding:6px; background:#1b1d21; color:#e6e6e6; border:1px solid #33363c; border-radius:5px; }
    .sb-search select { padding:5px; background:#1b1d21; color:#e6e6e6; border:1px solid #33363c; border-radius:5px; }
    button.mini { width:auto; margin:2px 0; padding:5px 9px; font-size:12px; }
    .sb-acc { margin-top:8px; border-top:1px solid #2c2f36; }
    .sb-acc > summary { cursor:pointer; color:#9aa0a6; font-size:12px; padding:6px 0; }
    .sb-acc input { width:100%; box-sizing:border-box; padding:6px; margin:3px 0; background:#1b1d21; color:#e6e6e6; border:1px solid #33363c; border-radius:5px; }
    /* 세로 갤러리 썸네일 */
    #gallery-panel .gal-thumb { display:block; width:100%; height:auto; border-radius:4px; }
    #gallery-panel .gal-item { position:relative; margin:5px 0; }
    #gallery-panel .gal-ae { display:none; position:absolute; top:4px; right:4px;
      width:auto; margin:0; padding:2px 6px; font-size:11px; background:rgba(0,0,0,0.65); }
    #gallery-panel .gal-item:hover .gal-ae { display:block; }
    /* 좁은 창: 세로 스택 + 일반 스크롤로 복귀 */
    @media (max-width: 720px) {
      #sb-2pane { flex-direction:column; height:auto; }
      #sb-right { width:auto; flex:none; }
      #sb-left, #sb-right { overflow:visible; }
      #tab-content { overflow-y:auto; }
      #tab-storyboard, #tab-planning { height:auto; }
    }

    /* 목록 뷰만 가운데 정렬(상세 뷰는 full-width 사용) */
    @media (min-width: 760px) {
      #view-list { max-width:520px; margin:0 auto; }
    }

    /* 이미지 생성 모달 */
    #genModal { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100;
      display:flex; align-items:center; justify-content:center; }
    #genModal[hidden] { display:none; }
    #genModal .gen-box { width:min(420px,92vw); max-height:88vh; overflow-y:auto;
      background:#23262b; border:1px solid #33363c; border-radius:10px; padding:16px; }
    #genModal .gen-head { display:flex; justify-content:space-between; align-items:center;
      font-size:14px; font-weight:600; margin-bottom:8px; }
    #genModal select, #genModal input, #genModal textarea { width:100%; box-sizing:border-box;
      padding:7px; margin:3px 0; background:#1b1d21; color:#e6e6e6; border:1px solid #33363c; border-radius:5px; }
    #genModal .gen-actions { display:flex; gap:8px; margin-top:10px; }
    #genModal .gen-actions button { flex:1; }
  </style>
</head>
<body>
  <!-- ===== 목록 뷰 ===== -->
  <div id="view-list">
    <h1>auto_kairos PD</h1>

    <div class="label">1) 백엔드 연결</div>
    <button id="btnHealth">백엔드 확인</button>
    <div class="box" id="health">—</div>

    <div class="label">새 프로젝트</div>
    <input id="newTitle" type="text" placeholder="영상 제목/주제" style="width:100%;box-sizing:border-box;padding:7px;margin:3px 0;background:#1b1d21;color:#e6e6e6;border:1px solid #33363c;border-radius:5px;">
    <select id="newStyle" style="width:49%;padding:6px;background:#1b1d21;color:#e6e6e6;border:1px solid #33363c;border-radius:5px;">
      <option value="semoji">semoji</option>
      <option value="iromism">iromism</option>
    </select>
    <select id="newDuration" style="width:49%;padding:6px;background:#1b1d21;color:#e6e6e6;border:1px solid #33363c;border-radius:5px;">
      <option value="1분">1분</option><option value="3분">3분</option><option value="5분">5분</option>
    </select>
    <button id="btnCreate">프로젝트 만들기</button>
    <div class="box" id="current">현재 프로젝트: (없음)</div>

    <div class="label">프로젝트</div>
    <button id="btnProjects">프로젝트 목록 새로고침</button>
    <div class="box" id="projects">—</div>
  </div>

  <!-- ===== 상세 뷰 ===== -->
  <div id="view-detail" hidden>
    <div id="detail-header">
      <span id="detailTitle">프로젝트</span>
      <button id="btnBackToList">← 목록</button>
    </div>
    <div id="task-bar">태스크: (P5에서 활성)</div>
    <div id="tabs">
      <button id="btnTabPlanning" class="tab active">기획</button>
      <button id="btnTabStoryboard" class="tab">스토리보드</button>
    </div>
    <div id="tab-content">
      <!-- 기획 탭 -->
      <div id="tab-planning">
        <div class="label">결과물 (기획·리서치·원고)</div>
        <button id="btnReloadFiles">파일 새로고침</button>
        <div class="box" id="planFiles" style="min-height:40px">—</div>
        <div class="label">미리보기</div>
        <div class="box" id="planViewer" style="max-height:50vh;overflow:auto">파일을 선택하세요.</div>
      </div>

      <!-- 스토리보드 탭 -->
      <div id="tab-storyboard" hidden>
        <div id="sb-2pane">
          <!-- 좌: 프로덕션 시트 -->
          <div id="sb-left">
            <div class="label">프로덕션 시트
              <button id="btnLoadSheet" class="mini">시트 불러오기</button>
            </div>
            <div id="sheet">—</div>
          </div>

          <!-- 우: 도구상자 + 세로 갤러리 -->
          <div id="sb-right">
            <div id="sb-toolbar">
              <button id="btnOpenGenModal" title="이미지 생성(SB2)">+ 이미지 생성</button>
              <button id="btnDecompose" class="alt">씬 분해</button>
              <button id="btnRefreshCharacters" class="alt">캐릭터</button>
              <button id="btnGalRefresh" class="alt">소스</button>
            </div>
            <div class="sb-search">
              <input id="galSearch" type="text" placeholder="이미지 검색">
              <select id="galEngine">
                <option value="serper">구글</option>
                <option value="pixabay">pixabay</option>
              </select>
              <button id="btnGalSearch" class="mini">검색</button>
            </div>
            <div class="box" id="gallery-panel" style="min-height:60px">—</div>

            <!-- 기준 캐릭터(임시 — SB2에서 모달로 통합) -->
            <details class="sb-acc">
              <summary>기준 캐릭터</summary>
              <input id="charName" type="text" placeholder="이름 (예: 지오)">
              <input id="charLooks" type="text" placeholder="헤어·의상">
              <button id="btnGenCharacter" class="mini">캐릭터 생성</button>
              <div class="box" id="characters">—</div>
            </details>

            <!-- 배치·고급(레거시 — 접이식, 바인딩 보존) -->
            <details class="sb-acc">
              <summary>배치 · 고급</summary>
              <div class="label">씬 분해 결과</div>
              <div class="box" id="scenes">—</div>
              <div class="label">레퍼런스 이미지</div>
              <button id="btnRefList" class="mini">레퍼런스 목록</button>
              <button id="btnGenImages" class="mini alt">이미지 생성</button>
              <div class="box" id="gallery">—</div>
              <button id="btnImportImages" class="mini alt">레퍼런스 → AE</button>
              <button id="btnRefreshGallery" class="mini">갤러리 새로고침</button>
              <div class="label">씬 이미지(배치)</div>
              <button id="btnGenStoryboard" class="mini">씬 이미지 생성</button>
              <div class="box" id="storyboard">—</div>
              <button id="btnRefreshStoryboard" class="mini">새로고침</button>
              <button id="btnImportStoryboard" class="mini alt">→ AE</button>
              <div class="label">씬 레이어(배치)</div>
              <button id="btnGenLayers" class="mini">레이어 생성</button>
              <div class="box" id="layers">—</div>
              <button id="btnRefreshLayers" class="mini">레이어 새로고침</button>
              <button id="btnImportLayers" class="mini alt">레이어 → AE</button>
              <div class="label">AE 컴프</div>
              <button id="btnBuild" class="mini alt">manifest → AE 컴프</button>
              <div class="box" id="aeresult">—</div>
            </details>
          </div>
        </div>
      </div>
    </div>

    <!-- 하단 채팅(P7 제작 비서) -->
    <div id="chat-dock">
      <div class="label" style="margin:0 0 4px">💬 제작 비서</div>
      <div class="box" id="chatLog" style="max-height:22vh;overflow:auto;margin-bottom:4px">무엇을 할까요? (예: "이미지 없는 씬 채우고 음성 입혀서 합쳐줘")</div>
      <div class="row">
        <input id="chatInput" type="text" placeholder='지시를 입력하세요…'>
        <button id="btnChatSend">전송</button>
      </div>
    </div>
  </div>

  <!-- 이미지 생성 모달 -->
  <div id="genModal" hidden>
    <div class="gen-box">
      <div class="gen-head">이미지 생성 <button id="genClose" class="mini">✕</button></div>
      <div class="label">카테고리</div>
      <select id="genCategory">
        <option value="character">캐릭터</option>
        <option value="background">배경</option>
        <option value="prop">소품</option>
        <option value="scene">씬</option>
      </select>

      <div class="label">아트스타일</div>
      <select id="genStyle">
        <option value="semoji">세모지(semoji)</option>
      </select>

      <div id="genFieldName" class="gen-field">
        <div class="label">이름</div>
        <input id="genName" type="text" placeholder="예: 지오 / 작업실 배경 / 렌치">
      </div>

      <div id="genFieldScene" class="gen-field" hidden>
        <div class="label">씬 선택</div>
        <select id="genScene"></select>
      </div>

      <div id="genFieldChar" class="gen-field" hidden>
        <div class="label">기준 캐릭터(스타일, 선택)</div>
        <select id="genChar"><option value="">(없음)</option></select>
      </div>

      <div class="label" id="genPromptLabel">설명 / 프롬프트</div>
      <textarea id="genPrompt" rows="3" placeholder="헤어·의상(캐릭터) / 장면 설명(배경·소품) / 씬은 비우면 원고 기반"></textarea>

      <div class="gen-actions">
        <button id="genSubmit">생성</button>
        <button id="genCancel" class="alt">취소</button>
      </div>
      <div class="box" id="genStatus" style="min-height:16px">—</div>
    </div>
  </div>

  <script src="js/main.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/planning.js"></script>
  <script src="js/storyboard.js"></script>
  <script src="js/gallery.js"></script>
  <script src="js/genmodal.js"></script>
  <script src="js/assistant.js"></script>
</body>
</html>
